<!DOCTYPE html>
<html lang="en">
	<head>
    	<title>CLI</title>
    	<meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
        <style>
        	html {
                background-color: black;
                font-family: 'Courier Prime', sans-serif;
                user-select: none;
                margin: 0;
                margin-bottom: 50px;
                padding: 0;
                color: white;
            }
            #commandInputArea {
                display: inline;
                position: fixed;
                bottom: 0px;
                left: 0px;
                text-align: left;
                font-size: 24px;
                padding: 5px 10px;
                margin: 0;
                background-color: rgba(0,0,0);
                backdrop-filter: blur(5px);
                border-top: 0.5px solid white;
                width: 100%;
            }
            .pastCommandArea {
                display: inline;
                top: 0px;
                text-align: left;
                font-size: 0.5px;
                border: none;
                width: 90%;
            }
            .newOutput {
                display: inline-block;
                top: 0px;
                text-align: left;
                font-size: 24px;
                padding: 2px;
                border: none;
                width: 90%;
                margin: 0px 5px;
            }
            #indicator {
                background-color: white;
            }
            .error {
                font-weight: bold;
            }
            .error span {
                font-weight: bold
            }
            #toptext {
                position: fixed;
                top: 0;
                right: 0;
                padding: 0px;
                margin: 5px;
                text-align: right;
                display: none;
            }
        </style>
    </head>
    <body>
        <p id="toptext"><span id="time"></span><br>CLI v<span id="versionOutput">1.0.0</span></p>
    	<p><span class="pastCommandArea"><span></span> <span id="output"></span></span></p>
    	<p id="commandInputArea"><span id="beginInput"></span><span id="activeCommand"></span><span id="commandInput"></span><span id="indicator">E</span></p>
    	<script>
        	const version = '1.0.0-beta3';
            const newHere = 'New Commands:<br>theme [theme] - Change the color scheme to a preset colors. <br>Preset names: classic, hacker, powershell, cmd.<br>reset - Clear the screen and reset all settings.';

            let commandLine = '';
            let commandRequest;
            let commandOption;
            let processOutput;
            let pastCommand;
            let ans;
            let processPercent;
            let specialCharacter = false;
            let usrname = 'sysAdmin';
            let currentInput = '';

            let pastCommands = [];
            let pastRequests = -1;

            let themes = {
                hacker: {
                    textColor: '#00FF00',
                    backgroundColor: 'black',
                    indicatorColor: '#00FF00'
                },
                powershell: {
                    textColor: 'white',
                    backgroundColor: '#000080',
                    indicatorColor: 'white'
                },
                cmd: {
                    textColor: 'white',
                    backgroundColor: 'black',
                    indicatorColor: 'white'
                }
            };

            const html = document.querySelector('html');
            const versionOutput = document.getElementById('versionOutput');
            const commandInput = document.getElementById('commandInput');
            const activeCommand = document.getElementById('activeCommand');
            const indicator = document.getElementById('indicator');
            const output = document.getElementById('output');
            const input = '/#> '
            const activeInput = '//#> ';
            const customMenu = document.getElementById('customMenu');
            const costumMenuItems = document.querySelectorAll('.customMenuItems');
            const coordsOutput = document.getElementById('coordsOutput');
            const cursor = document.getElementById('cursor');
            const time = document.getElementById('time');
            const beginInput = document.getElementById('beginInput');
            var currentCommand = '';
            const error = 'UNKNOWN COMMAND';
            const toptext = document.getElementById('toptext');
            versionOutput.innerHTML = version;
            
            // switched to LLM gateway key as requested
            const OPENAI_API_KEY = "llmgtwy_76EO0WkmXufRRFC6fKdmr1ilBulBb1YIFWGdaRGv";
            
            document.addEventListener('keydown', function(event) {
                // Define an array of excluded keys
                const excludedKeys = ['Tab', 'Control', 'Shift', 'Alt', 'Backspace', 'Enter', 'Meta', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'F1', 'F2', 'F3', 'F4', 'F5', 'F6', 'F7', 'F8', 'F9', 'F10', 'F11', 'F12'  ];

                // Replace the condition with a simpler check
                if (!excludedKeys.includes(event.key)) {
                    if (currentCommand === 'calc' && commandLine.length === 0) {
                    if (['+', '-', '*', '/'].includes(event.key)) {
                        commandLine = String(ans);
                    } else if (event.key === 'r') {
                        specialCharacter = true;
                        commandLine = 'Round';
                    }
                    }
                    if (!specialCharacter) commandLine += event.key;
                    commandInput.innerHTML = commandLine;
                    specialCharacter = false;
                }
                if (event.key === 'Backspace') {
                    if (commandLine.length === 0) {
                        currentInput = '';
                        activeCommand.innerHTML = '';
                        currentCommand = '';
                        commandInput.innerHTML = '';
                        commandLine = '';
                    }
                    commandLine = commandLine.substring(0, commandLine.length - 1);
                    commandInput.innerHTML = commandLine;
                }
                if (event.ctrlKey && event.key === 'Backspace') {
                    pastRequests = -1;
                    commandInput.innerHTML = '';
                    commandLine = '';
                }
                if (event.key === 'Enter') {
                    //output.innerHTML = commandLine;
                    runCommand();
                }
            });
            document.addEventListener('keydown', function(event) {
                if (event.key === 'ArrowUp') {
                    //preventDefault();
                    if (pastRequests + 1 !== pastCommands.length) {
                        pastRequests++;
                        commandLine = pastCommands[pastRequests];
                        commandInput.innerHTML = commandLine;
                    }
                } else if (event.key === 'ArrowDown') {
                    if (pastRequests !== -1) {
                        if (pastRequests - 1 !== -1) {
                            pastRequests--;
                            commandLine = pastCommands[pastRequests];
                            commandInput.innerHTML = commandLine;
                        }
                    }
                }
            });

            function runCommand() {
                pastCommands.unshift(commandLine);
                console.log(pastCommands);

                pastRequests = -1;
                
                let commandOptions = commandLine.split(' ');
                commandRequest = commandOptions[0];
                commandOptions.shift();
                // Don't echo the prompt when entering interactive modes like calc or script
                const interactiveModes = ['calc', 'script'];
                if (!interactiveModes.includes(commandRequest)) {
                    output.innerHTML = '<span style="font-weight: bold;">' + usrname + input + currentCommand + currentInput + '</span>' + commandLine;
                    newLine();
                }
                
                // CHECK FOR ACTIVE COMMANDS
                if (activeCommand.length !== 0) {
                    runActive();
                }

                //COMPLEX COMMANDS
                switch (commandRequest) {
                    case 'q':
                        clear();
                        break;
                    case 'clear':
                        clear();
                        break;
                    case 'calc':
                        currentInput = activeInput;
                        activeCommand.innerHTML = commandLine + currentInput;
                        currentCommand = 'calc';
                        break;
                    case 'usrname':
                        if (!commandOptions[0]) {
                            output.innerHTML = 'Syntax incorrect<br>Usage: usrname [new username]';
                        } else {
                            usrname = commandOptions[0];
                            usrname.innerHTML = usrname;
                            output.innerHTML = 'Username changed to ' + usrname;
                            updateUsrname();
                        }
                        break;
                    case 'whoami':
                        output.innerHTML = 'You are ' + usrname;
                        break;
                    case 'txt':
                        if (!commandOptions[0]) {
                            output.innerHTML = 'Syntax incorrect<br>Usage: txt [text]';
                        } else {
                            output.innerHTML = commandOptions.join(' ');
                        }
                        break;
                    case 'script':
                        currentInput = activeInput;
                        activeCommand.innerHTML = commandLine + currentInput;
                        currentCommand = 'script';
                        break;
                    case 'AItest':
                        output.innerHTML = 'AI features will come in later updates';
                        break;
                    case 'help':
                        const helpCommands = [
                            { name: 'calc', desc: 'Perform calculations' },
                            {name: 'color [text color] [background color]', desc: 'Change the text and background colors' },
                            { name: 'dnt', desc: 'Display current date and time' },
                            { name: 'q/clear', desc: 'Clear all output text' },
                            { name: 'resetcolor', desc: 'Reset the colors back to default' },
                            { name: 'script', desc: 'Run Javascript through the Command Line' },
                            { name: 'sysinfo', desc: 'See specifications of current device' },
                            { name: 'txt [text]', desc: 'Repeat whatever you type in the Command Line' },
                            { name: 'usrname [username]', desc: 'Change your username' },
                            { name: 'version', desc: 'Display the version number of program' },
                            {name: 'whoami', desc: 'Display your username' },
                            { name: 'theme [theme]', desc: 'Change the color scheme to preset themes' },
                            { name: 'reset', desc: 'Clear the screen and reset all settings' },
                            { name: 'showtime [true/false]', desc: 'Show or hide the time in the top right corner' },
                            { name: 'about', desc: 'Learn about this program' },
                            { name: 'savetheme [theme name]', desc: 'Save the current color scheme as a new theme' },
                            { name: 'deltheme [theme name]', desc: 'Delete a custom saved theme' },
                            { name: 'themes', desc: 'List all preset and custom themes' },
                            { name: 'AItest', desc: 'Test out AI features (coming soon)' }
                        ];
                        
                        // If a specific command is provided, show only that command's help
                        if (commandOptions[0]) {
                            const searchCmd = commandOptions[0].toLowerCase();
                            const found = helpCommands.find(cmd => cmd.name.toLowerCase().includes(searchCmd));
                            if (found) {
                                output.innerHTML = `<span class="command-help">${found.name}</span> - ${found.desc}`;
                            } else {
                                output.innerHTML = `Command "${commandOptions[0]}" not found. Type "help" for all commands.`;
                            }
                        } else {
                            // Show all commands if no specific command is given
                            helpCommands.sort((a, b) => a.name.localeCompare(b.name));
                            
                            helpCommands.forEach((cmd, index) => {
                                const padding = '.'.repeat(Math.max(1, 25 - cmd.name.length));
                                output.innerHTML = `<span class="command-help">${cmd.name}</span> ${padding} ${cmd.desc}`;
                                if (index < helpCommands.length - 1) newLine();
                            });
                        }
                        break;
                    case 'sysinfo':
                        /*output.innerHTML = navigator.userAgent;
                        newLine();*/
                        output.innerHTML = 'Platform: ' + navigator.platform;
                        newLine();
                        output.innerHTML = 'CPU Cores: ' + navigator.hardwareConcurrency;
                        newLine();
                        output.innerHTML = 'Device Memory: ' + navigator.deviceMemory + 'GB RAM';
                        newLine();
                        output.innerHTML = 'Language: ' + navigator.language;
                        newLine();
                        output.innerHTML = 'Screen Resolution: ' + screen.width + 'x' + screen.height;
                        break;
                    case 'dnt':
                        const now = new Date();
                        const options = {
                            weekday: 'long',
                            year: 'numeric',
                            month: 'long',
                            day: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit',
                            second: '2-digit',
                            timeZoneName: 'short'
                        };
                        const formattedDateTime = now.toLocaleString(undefined, options);
                        output.innerHTML = formattedDateTime;
                        break; 
                    case 'color':
                        html.style.color = commandOptions[0];
                        indicator.style.backgroundColor = commandOptions[0];
                        html.style.backgroundColor = commandOptions[1];
                        commandInputArea.style.backgroundColor = commandOptions[1];
                        commandInputArea.style.borderColor = commandOptions[0];
                        if (!commandOptions[0]) {
                            output.innerHTML = 'Syntax incorrect<br>Usage: color [text color] [background color]';
                        }
                        break;
                    case 'themes':
                        for (let theme in themes) {
                            output.innerHTML += theme + '<br>';
                        }
                        break;
                    case 'theme':
                        if (!commandOptions[0]) {
                            output.innerHTML = 'Syntax incorrect<br>Usage: theme [theme name]<br>Type "themes" for a list of themes';
                        } else {
                            if (themes[commandOptions[0]]) {
                                html.style.color = themes[commandOptions[0]].textColor;
                                indicator.style.backgroundColor = themes[commandOptions[0]].indicatorColor;
                                html.style.backgroundColor = themes[commandOptions[0]].backgroundColor;
                                commandInputArea.style.backgroundColor = themes[commandOptions[0]].backgroundColor;
                                commandInputArea.style.borderColor = themes[commandOptions[0]].textColor;
                            } else {
                                output.innerHTML = 'Theme not found';
                            }
                        }
                        break;
                    case 'deltheme':
                        if (!commandOptions[0]) {
                            output.innerHTML = 'Syntax incorrect<br>Usage: deltheme [theme name]';
                        } else {
                            if (commandOptions[0] === 'hacker' || commandOptions[0] === 'powershell' || commandOptions[0] === 'cmd') {
                                output.innerHTML = 'Cannot delete preset themes';
                                break;
                            } else if (themes[commandOptions[0]]) {
                                delete themes[commandOptions[0]];
                                output.innerHTML = 'Theme ' + commandOptions[0] + ' deleted';
                            } else {
                                output.innerHTML = 'Theme not found';
                            }
                        }
                        break;
                    case 'savetheme':
                        if (!commandOptions[0]) {
                            output.innerHTML = 'Syntax incorrect<br>Usage: savetheme [theme name]';
                        } else {
                            if (commandOptions[0] === 'hacker' || commandOptions[0] === 'powershell' || commandOptions[0] === 'cmd') {
                                output.innerHTML = 'Theme name already exists';
                                break;
                            } else {
                                themes[commandOptions[0]] = {
                                    textColor: getComputedStyle(html).color,
                                    backgroundColor: getComputedStyle(html).backgroundColor,
                                    indicatorColor: getComputedStyle(indicator).backgroundColor
                                };
                                output.innerHTML = 'Theme saved as ' + commandOptions[0];
                            }
                        }
                        break;
                    case 'resetcolor':
                        resetColor();
                        break;
                    case 'reset':
                        reset();
                        break;
                    case 'showtime':
                    	if (!commandOptions[0]) output.innerHTML = 'Syntax incorrect<br>Usage: showtime [true/false]';
                        else {
                            if (commandOptions[0] === 'true') toptext.style.display = 'block';
                            else if (commandOptions[0] === 'false') toptext.style.display = 'none';
                        }
                        break;
                    case 'version':
                        output.innerHTML = 'CLI v' + version;
                        break;
                    case 'about':
                        output.innerHTML = 'CLI is a web-based command line interface. It is currently in early development and is made for fun and to practice programming.';
                        break;
                    default:
                        if (commandLine !== '') output.innerHTML = error;
                }

                // OUTPUT
                commandLine = '';
                commandInput.innerHTML = '';
                if (output.innerHTML !== '') {
                    newLine();
                }
                document.querySelector('html').scrollTo(0, document.querySelector('html').scrollHeight);
            }
            function runActive() {
                if (currentCommand === 'calc') {
                    // Check for special conditions
                    if (commandLine === 'Round') {
                        ans = Math.round(ans);
                    } else { ans = eval(commandLine); }

                    //Output
                    output.innerHTML = ans;
                    commandLine = '';
                    commandInput.innerHTML = '';
                } else if (currentCommand === 'AItest') {
                    askAI(commandLine);
                    commandLine = '';
                    commandInput.innerHTML = '';
                } else if (currentCommand === 'script') {
                    output.innerHTML = eval(commandLine);
                    if (output.innerHTML === 'undefined') {
                        output.innerHTML = commandLine;
                    }
                    commandLine = '';
                    commandInput.innerHTML = '';
                } else if (currentCommand === 'usrname') {
                    activeCommand.innerHTML = '';
                    currentCommand = '';
                    commandInput.innerHTML = '';
                }
            }
            document.addEventListener('keydown', function(event) {
                if (event.ctrlKey && event.key === 'x') {
                    event.preventDefault();
                    activeCommand.innerHTML = '';
                    currentCommand = '';
                    commandInput.innerHTML = '';
                    commandLine = '';
                }
            });
            function newLine() {
                const newParagraph = document.createElement('p');
                const oldText = output.innerHTML;
                newParagraph.classList.add('newOutput');
                newParagraph.innerHTML = oldText;
                document.body.appendChild(newParagraph);
                output.innerHTML = '';
                const scrollHeight = document.body.scrollHeight || document.documentElement.scrollHeight;
                window.scrollTo(0, scrollHeight);
            }
            function indicatorAnimation() {
                indicator.style.opacity = 0;
                setTimeout(function() {
                    indicator.style.opacity = 1;
                    setTimeout(indicatorAnimation, 500);
                }, 500);
            }
            indicatorAnimation();
            function loading() {
                setTimeout(function() {
                    output.innerHTML += '-';
                }, 100);
            }
            function timeUpdate() {
                const now = new Date();
                const options = {
                    month: '2-digit',
                    day: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                };
                const formattedDateTime = now.toLocaleString(undefined, options);
                time.innerHTML = formattedDateTime;
                setTimeout(timeUpdate, 100);
            }
            timeUpdate();

            function exit() {
                window.close();
            }
            function clear() {
                const elementsToRemove = document.querySelectorAll('p.newOutput');
                elementsToRemove.forEach(element => {
                    element.remove();
                });
            }
            function resetColor() {
                html.style.color = 'white';
                indicator.style.backgroundColor = 'white';
                html.style.backgroundColor = 'black';
                commandInputArea.style.backgroundColor = 'black';
                commandInputArea.style.borderColor = 'white';
            }
            function updateUsrname() {
                beginInput.innerHTML = usrname + input;
            }
            updateUsrname();
            function reset() {
                output.innerHTML = 'Resetting...';
                setTimeout(function() {
                    clear();
                    resetColor();
                    html.style.fontFamily = 'Courier Prime', sans-serif;
                }, 500);
            }
            function askAI(commandLine) {
                output.innerHTML = 'Asking EthaNet...';
                
                fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${OPENAI_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4',
                        messages: [{
                            role: 'user',
                            content: commandLine
                        }],
                        max_tokens: 500
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.choices && data.choices[0]) {
                        output.innerHTML = data.choices[0].message.content;
                    } else if (data.error) {
                        output.innerHTML = 'Error: ' + data.error.message;
                    } else {
                        output.innerHTML = 'Error: Unexpected response from API';
                    }
                    newLine();
                })
                .catch(error => {
                    output.innerHTML = 'Error: ' + error.message;
                    newLine();
                });
            }
        </script>
    </body>
</html>
